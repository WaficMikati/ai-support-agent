[project]
name = "ai-support-agent"
version = "0.1.0"
description = "Customer support agent: Chatwoot inbox, Groq classification, Stripe refunds"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
# Without this the editor cannot see the uv-managed virtualenv and reports
# every third-party import as unresolved.
venvPath = "."
venv = ".venv"
extraPaths = ["."]
